# herdr — terminal workspace manager.
# Keybindings mirror ~/.tmux.conf + ~/.tmux.conf.local so muscle memory carries over.

[theme]
name = "vesper"

[keys]
# tmux.conf.local: `set -g prefix C-a`
prefix = "ctrl+a"

# tmux.conf: `bind-key -r C-h select-window -t :-` / `C-l select-window -t :+`
# herdr tabs are the equivalent of tmux windows.
previous_tab = "prefix+ctrl+h"
next_tab = "prefix+ctrl+l"

# tmux.conf.local: `bind-key C-t split-window -l 10`   (stacked)
#                  `bind-key C-y split-window -h -l 20` (side by side)
split_horizontal = "prefix+ctrl+t"
split_vertical = "prefix+ctrl+y"

# tmux.conf: `bind-key h/j/k/l select-pane -L/-D/-U/-R`
# These are already herdr defaults; kept explicit so the mapping is obvious.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
