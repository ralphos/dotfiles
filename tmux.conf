# improve colors
set -g default-terminal 'screen-256color'

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Use a better prefix than the default C-b
unbind C-s
set -g prefix C-a

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# Status bar and pane borders, matched to the Vesper palette
set -g status-style bg='#1c1c1c',fg='#8b8b8b'
set -g pane-border-style 'fg=#2a2a2a'
set -g pane-active-border-style 'fg=#ffc799'

# remove administrative debris (session name, hostname, time) in status bar
set -g status-left ''
set -g status-right ''

# increase scrollback lines
set -g history-limit 10000

# prefix prefix -> send a literal C-a through to the shell
bind-key C-a send-prefix

# Split window to a 10-line pane below
unbind-key C-t
bind-key C-t split-window -l 10

# Split window to a 20-column pane on the right
unbind-key C-y
bind-key C-y split-window -h -l 20

# don't suspend-client
unbind-key C-z

# Forward focus events to applications running inside tmux (vim, Claude Code).
# Lets them detect pane focus changes so file-watchers and auto-reload work.
set -g focus-events on

# Mouse support. Hold Option while selecting to use the terminal's own selection.
set -g mouse on

# Machine-specific config, not tracked in this repo.
if-shell "[ -f ~/.tmux.conf.local ]" 'source ~/.tmux.conf.local'
